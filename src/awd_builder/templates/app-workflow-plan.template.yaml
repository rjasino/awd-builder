# Application workflow plan for `awd-builder app`.
# Preview first:  awd-builder app run <project> --dry-run
# Then scaffold:  awd-builder app run <project>

# Name of the application project.
name: my-app

# Harnesses to initialize in the same project. awd-builder maps these names to
# Spec Kit integration keys (for example claude-code -> claude and cursor -> cursor-agent).
harnesses:
  - claude-code
  # - opencode
  # - codex
  # - github-copilot
  # - pi
  # - cursor

# Folders to create in the project, relative to the project folder.
folders:
  - docs
  - src
  - tests

# Spec Kit extensions to install. Uncomment the ones you need:
#   assess  idea assessment before you build (go / needs-clarification / kill)
#   bug     bug assessment, fix and verification
extensions:
  # - assess
  # - bug
